name: Idea / Sugerencia
description: Something to improve or add. / Algo para mejorar o añadir.
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea / Tu idea
      description: What would you improve or add, and why would it help? / ¿Qué mejorarías o añadirías y para qué serviría?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: App version (optional) / Versión de la app (opcional)
